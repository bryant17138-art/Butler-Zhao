<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能客服回覆管家 - 小趙版</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --success: #10b981;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif, "Microsoft JhengHei";
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
            box-sizing: border-box;
        }

        h2 {
            text-align: center;
            color: var(--primary);
            margin-top: 0;
            margin-bottom: 5px;
        }

        .subtitle {
            text-align: center;
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        .time-info {
            background: rgba(255,255,255,0.05);
            border-radius: 12px;
            padding: 10px 15px;
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 20px;
            line-height: 1.6;
            border-left: 4px solid var(--primary);
        }

        .search-box {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #475569;
            background: #0f172a;
            color: var(--text-main);
            box-sizing: border-box;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .qa-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .qa-card {
            background: #334155;
            border-radius: 12px;
            padding: 15px;
            border-left: 5px solid var(--primary);
        }

        .guest-question {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-weight: bold;
        }

        .my-answer {
            font-size: 16px;
            color: var(--text-main);
            background: #1e293b;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 10px;
            white-space: pre-wrap;
            word-break: break-all;
            line-height: 1.5;
        }

        .copy-btn {
            width: 100%;
            background: var(--success);
            color: white;
            border: none;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.2s;
            font-size: 14px;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #10b981;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: bold;
            opacity: 0;
            transition: 0.3s;
            pointer-events: none;
            z-index: 999;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>📋 小趙客服對照工具</h2>
    <div class="subtitle">輸入客人說的話，一鍵複製專業回覆</div>

    <div class="time-info">
        ⏰ <b>設定服務時間：</b><br>
        • 線上服務：每日 10:00 - 20:00<br>
        • 午餐休眠：每日 11:00 - 13:00
    </div>

    <input type="text" id="searchInput" class="search-box" placeholder="🔍 輸入客人打的字（如：在嗎、休息）..." oninput="searchQA()">

    <div class="qa-list" id="qaList"></div>
</div>

<div class="toast" id="toast">📋 已複製到剪貼簿！</div>

<script>
    // 💡 這裡就是你的專屬小趙管家回覆劇本，隨時可以換成你想講的話！
    const qaDatabase = [
        {
            question: "客人問：哈囉在嗎？ / 有人在嗎？",
            answer: "您好！我是小趙管家 ⚡\n很高興為您服務！請問今天有什麼我可以協助您的呢？"
        },
        {
            question: "客人問：哈囉（在非營業時間 / 晚上8點後發訊息過來）",
            answer: "您好！我是小趙管家 🌙\n目前已過小趙的服務時間（10:00 - 20:00）。小趙現在正處於省電休眠狀態，您的訊息已好好妥存，明天早上 10:00 上線後我會立刻第一時間回覆您，祝您有個美好的一天！"
        },
        {
            question: "客人問：哈囉（在中下午11點到1點之間，午餐休息時間發訊息過來）",
            answer: "您好！我是小趙管家 🍱\n目前正值中午午餐休息充電時間（11:00 - 13:00），管家暫時離席去補充能量囉！下午 13:00 充電完畢後會馬上回到崗位回覆您，感謝您的耐心等待！"
        },
        {
            question: "客人問：這個商品還有嗎？ / 請問怎麼賣？",
            answer: "您好！這款目前都有現貨供應喔 ⚡\n請問您想了解哪一個規格或細節呢？小趙管家這就幫您查詢！"
        }
    ];

    function renderList(data) {
        const listContainer = document.getElementById('qaList');
        listContainer.innerHTML = '';
        if(data.length === 0) {
            listContainer.innerHTML = '<div style="text-align:center;color:var(--text-muted);margin-top:20px;">找不到對應的問答組合 🥺</div>';
            return;
        }
        data.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'qa-card';
            card.innerHTML = `
                <div class="guest-question">💬 ${item.question}</div>
                <div class="my-answer" id="text_${index}">${item.answer}</div>
                <button class="copy-btn" onclick="copyText('text_${index}')">📋 一鍵複製小趙回覆</button>
            `;
            listContainer.appendChild(card);
        });
    }

    function searchQA() {
        const keyword = document.getElementById('searchInput').value.toLowerCase();
        const filtered = qaDatabase.filter(item => 
            item.question.toLowerCase().includes(keyword) || 
            item.answer.toLowerCase().includes(keyword)
        );
        renderList(filtered);
    }

    function copyText(elementId) {
        const text = document.getElementById(elementId).innerText;
        const tempInput = document.createElement('textarea');
        tempInput.value = text;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand('copy');
        document.body.removeChild(tempInput);

        const toast = document.getElementById('toast');
        toast.style.opacity = '1';
        setTimeout(() => { toast.style.opacity = '0'; }, 1500);
    }

    // 初始化
    renderList(qaDatabase);
</script>
</body>
</html>
